# Python package metadata and optional dependency groups.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-detector"
version = "0.1.0"
description = "Local multi-engine AI text detector desktop app"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AI Detector" }]
dependencies = []

[project.optional-dependencies]
# Heavy ML dependencies stay optional so core tests can run without downloads.
ml = [
  "torch>=2.2",
  "transformers>=4.42",
  "sentencepiece>=0.2",
  "safetensors>=0.4",
]
pdf = [
  "pypdf>=4.0",
]
# The official Binoculars package is not a default dependency because it pins old tokenizers builds.
build = [
  "pyinstaller>=6.8",
]

[project.scripts]
ai-detector = "ai_detector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
